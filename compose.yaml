name: thu-chi
services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    container_name: thu-chi-test-db
    network_mode: none
    environment:
      POSTGRES_DB: thu_chi_test
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - thu-chi-test-data:/var/lib/postgresql/data
      - ./supabase:/migrations:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d thu_chi_test]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  thu-chi-test-data:
